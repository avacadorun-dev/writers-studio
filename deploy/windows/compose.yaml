name: writers-studio

# Standalone installation for Docker Desktop on Windows.
# This file intentionally has no `build:` section: it pulls the release image
# specified in .env from your configured registry.
services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - object-data:/data

  app:
    image: ${WRITERS_STUDIO_IMAGE:?set WRITERS_STUDIO_IMAGE in .env}
    # Updates are deliberate: run `docker compose pull` before `up -d`.
    # An already-installed app can start without contacting the registry.
    pull_policy: missing
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      OBJECT_STORAGE_ENDPOINT: storage:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-writers-studio}
      OBJECT_STORAGE_USE_SSL: "false"
      ALLOW_TEST_ADAPTERS: "false"
      STT_ADAPTER: ${STT_ADAPTER:-auto}
      LIVE_STT_ADAPTER: ${LIVE_STT_ADAPTER:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-openai/whisper-large-v3}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-nova-3}
      LLM_ADAPTER: ${LLM_ADAPTER:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_DIALECT: ${LLM_DIALECT:-chat_completions}
      LLM_CREDENTIAL_ENCRYPTION_KEY: ${LLM_CREDENTIAL_ENCRYPTION_KEY:-}
      LLM_ALLOW_PRIVATE_ENDPOINTS: ${LLM_ALLOW_PRIVATE_ENDPOINTS:-false}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-10m}
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8080}
      MCP_ENABLED: "false"
      STATIC_DIR: /app/web
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 40
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
  object-data:
